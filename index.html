<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(88, 50, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 50, 150, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 200, 255, 0.08) 0%, transparent 50%);
            overflow: hidden;
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Login Box */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            transition: 0.8s;
        }

        .login-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .login-box {
            background: rgba(20, 28, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .login-box .icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 900;
        }

        .login-box h1 .highlight {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-box .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px;
        }

        .login-box .tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #8892b0;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .login-box .tabs button.active {
            background: rgba(126, 184, 255, 0.15);
            color: #7eb8ff;
        }

        .login-box .tabs button:hover {
            color: #f0f4ff;
        }

        .login-box .form {
            display: none;
        }

        .login-box .form.active {
            display: block;
        }

        .login-box .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .login-box .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: #8892b0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .login-box .form-group input:focus {
            outline: none;
            border-color: #7eb8ff;
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #7eb8ff, #a78bfa);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn-auth:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(126, 184, 255, 0.25);
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: rgba(248, 113, 113, 0.08);
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.1);
        }

        .error-msg.show {
            display: block;
        }

        .login-box .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #4a5568;
        }

        /* ============================================================
           APP
           ============================================================ */
        #appContainer {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            font-size: 38px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text small {
            font-size: 14px;
            font-weight: 400;
            color: #8892b0;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(126, 184, 255, 0.08);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(126, 184, 255, 0.1);
        }

        .btn-logout {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.2);
            transform: translateY(-2px);
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ccd6f6;
        }

        .section-title span {
            color: #7eb8ff;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 22px;
            transition: 0.4s;
        }

        .subject-card:hover {
            transform: translateY(-6px);
            border-color: rgba(126, 184, 255, 0.3);
        }

        .subject-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .subject-card .name {
            font-size: 20px;
            font-weight: 700;
            color: #f0f4ff;
        }

        .subject-card .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
        }

        .subject-card .stats-grid .s {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .subject-card .stats-grid .s .num {
            font-size: 20px;
            font-weight: 900;
            color: #7eb8ff;
            display: block;
        }

        .subject-card .stats-grid .s .lbl {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
        }

        .subject-card .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .subject-card .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7eb8ff, #a78bfa);
            transition: width 0.6s ease;
        }

        .test-list {
            margin-top: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            border-left: 2px solid #7eb8ff;
        }

        .test-item .status-Done {
            color: #34d399;
        }
        .test-item .status-Planned {
            color: #fbbf24;
        }
        .test-item .status-Review {
            color: #f87171;
        }

        .btn-delete-test {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.5;
            transition: 0.3s;
        }

        .btn-delete-test:hover {
            opacity: 1;
        }

        .btn-delete-subject {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.3;
            transition: 0.3s;
        }

        .btn-delete-subject:hover {
            opacity: 1;
        }

        .btn-add-subject {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            color: #8892b0;
            padding: 16px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .btn-add-subject:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #7eb8ff;
            color: #f0f4ff;
        }

        .btn-add-test {
            background: rgba(126, 184, 255, 0.08);
            border: 1px solid rgba(126, 184, 255, 0.15);
            color: #7eb8ff;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-add-test:hover {
            background: rgba(126, 184, 255, 0.15);
            transform: scale(1.02);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(126, 184, 255, 0.2);
            transform: translateY(-4px);
        }

        .stat-card .icon {
            font-size: 28px;
            display: block;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 900;
            display: block;
            color: #7eb8ff;
            margin: 6px 0;
        }

        .stat-card .lbl {
            font-size: 12px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8892b0;
        }

        .empty-state .big-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #ccd6f6;
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 28, 50, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 32px;
            border-radius: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #8892b0;
            transition: 0.3s;
        }

        .modal-close:hover {
            color: #f0f4ff;
            transform: rotate(90deg);
        }

        .modal-content h2 {
            color: #ccd6f6;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: #8892b0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7eb8ff;
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-submit {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(126, 184, 255, 0.25);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .logo {
                justify-content: center;
            }
            .header-stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Stars -->
    <div class="stars" id="starsContainer"></div>

    <!-- =================== LOGIN =================== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <span class="icon">🚀</span>
            <h1><span class="highlight">Kimi</span> Notes</h1>
            <p class="subtitle">🔐 Sign in or create an account</p>

            <div class="tabs">
                <button class="active" data-tab="login" onclick="switchTab('login')">Sign In</button>
                <button data-tab="register" onclick="switchTab('register')">Sign Up</button>
            </div>

            <!-- Login -->
            <div class="form active" id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" />
                </div>
                <button class="btn-auth" onclick="loginUser()">🚀 Sign In</button>
                <div class="error-msg" id="loginError">❌ Invalid username or password</div>
            </div>

            <!-- Register -->
            <div class="form" id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="registerUsername" placeholder="Choose username" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Choose password (min 4 chars)" />
                </div>
                <button class="btn-auth" onclick="registerUser()">🌟 Create Account</button>
                <div class="error-msg" id="registerError">❌ Username already exists</div>
            </div>

            <div class="footer">🔒 Your data is stored locally in your browser</div>
        </div>
    </div>

    <!-- =================== APP =================== -->
    <div id="appContainer">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <span class="logo-text">
                    <span class="highlight">Kimi</span> Notes
                    <small>✦ Tracker</small>
                </span>
            </div>
            <div class="header-stats">
                <div class="user-badge">
                    <span>👤</span>
                    <span id="userDisplay">User</span>
                </div>
                <button class="btn-logout" onclick="logoutUser()">🚪 Logout</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-cards">
            <div class="stat-card">
                <span class="icon">📝</span>
                <span class="number" id="totalTests">0</span>
                <span class="lbl">Total Tests</span>
            </div>
            <div class="stat-card">
                <span class="icon">✅</span>
                <span class="number" id="completedTests">0</span>
                <span class="lbl">Completed</span>
            </div>
            <div class="stat-card">
                <span class="icon">📈</span>
                <span class="number" id="overallAverage">0%</span>
                <span class="lbl">Overall Avg</span>
            </div>
        </div>

        <!-- Subjects -->
        <section>
            <h2 class="section-title">📚 <span>Subjects</span></h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
            <button class="btn-add-subject" onclick="addSubject()">+ Add New Subject</button>
        </section>

    </div>

    <!-- =================== TEST MODAL =================== -->
    <div class="modal" id="testModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('testModal')">✕</span>
            <h2>➕ New Test</h2>
            <form id="testForm" onsubmit="addTest(event)">
                <input type="hidden" id="subjectName" />
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="testSubject" readonly />
                </div>
                <div class="form-group">
                    <label>Test Title</label>
                    <input type="text" id="testTitle" required placeholder="e.g. Grammar Quiz" />
                </div>
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" id="testTopic" placeholder="e.g. Grammar" />
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="testDate" required />
                </div>
                <div class="form-group">
                    <label>Total Marks</label>
                    <input type="number" id="testTotal" required placeholder="e.g. 50" step="0.1" />
                </div>
                <div class="form-group">
                    <label>Your Score</label>
                    <input type="number" id="testScore" required placeholder="e.g. 45" step="0.1" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="testStatus">
                        <option value="Done">✅ Done</option>
                        <option value="Planned">📅 Planned</option>
                        <option value="Review">🔄 Review</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">💾 Save Test</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        //  USER SYSTEM
        //  ============================================================

        // Default users
        const DEFAULT_USERS = {
            'admin': 'admin123',
            'demo': 'demo123'
        };

        function getUsers() {
            try {
                const raw = localStorage.getItem('kimiUsers');
                if (raw) {
                    const users = JSON.parse(raw);
                    return { ...DEFAULT_USERS, ...users };
                }
            } catch (e) { /* ignore */ }
            return DEFAULT_USERS;
        }

        function saveUsers(users) {
            const toSave = {};
            for (const [key, value] of Object.entries(users)) {
                if (!DEFAULT_USERS[key]) {
                    toSave[key] = value;
                }
            }
            localStorage.setItem('kimiUsers', JSON.stringify(toSave));
        }

        function addUser(username, password) {
            const users = getUsers();
            if (users[username]) return false;
            users[username] = password;
            saveUsers(users);
            return true;
        }

        function validateUser(username, password) {
            const users = getUsers();
            if (!users[username]) return false;
            return users[username] === password;
        }

        // ============================================================
        //  USER DATA
        //  ============================================================

        let currentUser = null;
        let currentUserData = null;

        function getUserData(username) {
            try {
                const raw = localStorage.getItem(`kimiData_${username}`);
                if (raw) return JSON.parse(raw);
            } catch (e) { /* ignore */ }
            return { subjects: {} };
        }

        function saveUserData(username, data) {
            localStorage.setItem(`kimiData_${username}`, JSON.stringify(data));
        }

        // ============================================================
        //  LOGIN / REGISTER
        //  ============================================================

        function switchTab(tab) {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
        }

        function registerUser() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const errorEl = document.getElementById('registerError');

            errorEl.classList.remove('show');

            if (!username || !password) {
                errorEl.textContent = '❌ Please fill all fields';
                errorEl.classList.add('show');
                return;
            }

            if (password.length < 4) {
                errorEl.textContent = '❌ Password must be at least 4 characters';
                errorEl.classList.add('show');
                return;
            }

            if (addUser(username, password)) {
                alert(`✅ Account "${username}" created! Please sign in.`);
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerPassword').value = '';
                switchTab('login');
                document.getElementById('loginUsername').value = username;
            } else {
                errorEl.textContent = '❌ Username already exists';
                errorEl.classList.add('show');
            }
        }

        function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');

            if (!username || !password) {
                errorEl.textContent = '❌ Please fill all fields';
                errorEl.classList.add('show');
                return;
            }

            if (validateUser(username, password)) {
                currentUser = username;
                currentUserData = getUserData(username);

                localStorage.setItem('kimiSession', JSON.stringify({
                    username: username,
                    timestamp: Date.now()
                }));

                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('userDisplay').textContent = username;

                renderAll();
                errorEl.classList.remove('show');
                document.getElementById('loginPassword').value = '';
            } else {
                errorEl.textContent = '❌ Invalid username or password';
                errorEl.classList.add('show');
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
            }
        }

        function logoutUser() {
            if (!confirm('🚪 Logout?')) return;
            localStorage.removeItem('kimiSession');
            currentUser = null;
            currentUserData = null;
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').focus();
        }

        function checkSession() {
            const session = localStorage.getItem('kimiSession');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.username && validateUser(data.username, getUsers()[data.username])) {
                        currentUser = data.username;
                        currentUserData = getUserData(data.username);

                        document.getElementById('loginOverlay').classList.add('hidden');
                        document.getElementById('appContainer').style.display = 'block';
                        document.getElementById('userDisplay').textContent = data.username;

                        renderAll();
                        return;
                    }
                } catch (e) { /* ignore */ }
            }

            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('loginUsername').focus();
        }

        // ============================================================
        //  SUBJECTS
        //  ============================================================

        function getData() {
            if (!currentUser) return { subjects: {} };
            return currentUserData || { subjects: {} };
        }

        function saveData(data) {
            if (currentUser) {
                saveUserData(currentUser, data);
                currentUserData = data;
            }
        }

        function getTestsForSubject(subject) {
            const data = getData();
            return data.subjects[subject]?.tests || [];
        }

        function getSubjectAvg(subject) {
            const tests = getTestsForSubject(subject);
            let total = 0,
                count = 0;
            for (const t of tests) {
                if (t.total > 0) {
                    total += (t.score / t.total);
                    count++;
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectProgress(subject) {
            const tests = getTestsForSubject(subject);
            if (tests.length === 0) return 0;
            let done = 0;
            for (const t of tests) {
                if (t.status === 'Done') done++;
            }
            return done / tests.length;
        }

        function getTotalTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                count += dataObj.subjects[s].tests.length;
            }
            return count;
        }

        function getCompletedTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') count++;
                }
            }
            return count;
        }

        function getOverallAvg(dataObj) {
            let total = 0,
                count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.total > 0) {
                        total += (t.score / t.total);
                        count++;
                    }
                }
            }
            return count > 0 ? total / count : 0;
        }

        // ============================================================
        //  RENDER
        //  ============================================================

        function renderAll() {
            renderSubjects();
            renderStats();
        }

        function renderSubjects() {
            const data = getData();
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';

            const subjectNames = Object.keys(data.subjects);
            if (subjectNames.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <span class="big-emoji">🚀</span>
                                <h3>No subjects yet!</h3>
                                <p style="color: #8892b0;">Click "Add New Subject" to start tracking.</p>
                            </div>
                        `;
                return;
            }

            for (const [name, sub] of Object.entries(data.subjects)) {
                const tests = sub.tests;
                const avg = getSubjectAvg(name);
                const progress = getSubjectProgress(name);
                const doneCount = tests.filter(t => t.status === 'Done').length;

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                            <div class="card-header">
                                <span class="name">${sub.emoji || '📚'} ${name}</span>
                                <span>
                                    <button class="btn-delete-subject" onclick="deleteSubject('${name}')" title="Delete subject">🗑️</button>
                                </span>
                            </div>
                            <div class="stats-grid">
                                <div class="s"><span class="num">${tests.length}</span><span class="lbl">Tests</span></div>
                                <div class="s"><span class="num">${doneCount}</span><span class="lbl">Done</span></div>
                                <div class="s"><span class="num">${(avg * 100).toFixed(0)}%</span><span class="lbl">Avg</span></div>
                                <div class="s"><span class="num">${(progress * 100).toFixed(0)}%</span><span class="lbl">Progress</span></div>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress * 100}%;"></div></div>
                            <div class="test-list">
                                ${tests.slice().reverse().slice(0, 5).map(t => `
                                    <div class="test-item">
                                        <span>${t.title}</span>
                                        <span>
                                            <span class="status-${t.status}">${t.status}</span>
                                            <button class="btn-delete-test" onclick="deleteTest('${name}', '${t.title}')">✕</button>
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn-add-test" onclick="openModal('${name}')">+ Add Test</button>
                        `;
                grid.appendChild(card);
            }
        }

        function renderStats() {
            const data = getData();
            const total = getTotalTests(data);
            const completed = getCompletedTests(data);
            const avg = getOverallAvg(data);
            document.getElementById('totalTests').textContent = total;
            document.getElementById('completedTests').textContent = completed;
            document.getElementById('overallAverage').textContent = (avg * 100).toFixed(0) + '%';
        }

        // ============================================================
        //  ACTIONS
        //  ============================================================

        function openModal(subject) {
            document.getElementById('subjectName').value = subject;
            document.getElementById('testSubject').value = subject;
            document.getElementById('testTitle').value = '';
            document.getElementById('testTopic').value = '';
            document.getElementById('testDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('testTotal').value = '';
            document.getElementById('testScore').value = '';
            document.getElementById('testStatus').value = 'Done';
            document.getElementById('testModal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function addTest(e) {
            e.preventDefault();
            const data = getData();
            const subject = document.getElementById('subjectName').value;
            const title = document.getElementById('testTitle').value.trim();
            const topic = document.getElementById('testTopic').value.trim();
            const date = document.getElementById('testDate').value;
            const total = parseFloat(document.getElementById('testTotal').value);
            const score = parseFloat(document.getElementById('testScore').value);
            const status = document.getElementById('testStatus').value;

            if (!subject || !title || !date || isNaN(total) || isNaN(score)) {
                alert('❌ Please fill all required fields');
                return;
            }

            if (!data.subjects[subject]) {
                data.subjects[subject] = { emoji: '📚', tests: [] };
            }

            data.subjects[subject].tests.push({ title, topic, date, total, score, status });

            saveData(data);
            renderAll();
            closeModal('testModal');
        }

        function deleteTest(subject, title) {
            if (!confirm(`❌ Delete test "${title}"?`)) return;
            const data = getData();
            data.subjects[subject].tests = data.subjects[subject].tests.filter(t => t.title !== title);
            saveData(data);
            renderAll();
        }

        function deleteSubject(subject) {
            if (!confirm(`❌ Delete subject "${subject}"?`)) return;
            const data = getData();
            delete data.subjects[subject];
            saveData(data);
            renderAll();
        }

        function addSubject() {
            const name = prompt('📚 Enter subject name:');
            if (!name || name.trim() === '') return;
            const emoji = prompt('🎨 Enter emoji (optional):') || '📚';
            const data = getData();
            if (data.subjects[name.trim()]) {
                alert('❌ Subject already exists');
                return;
            }
            data.subjects[name.trim()] = { emoji, tests: [] };
            saveData(data);
            renderAll();
        }

        // ============================================================
        //  STARS
        //  ============================================================

        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        //  ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('loginOverlay');
                if (!overlay.classList.contains('hidden')) {
                    const activeForm = document.querySelector('.form.active');
                    if (activeForm.id === 'loginForm') loginUser();
                    else registerUser();
                }
            }
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
            }
        });

        // ============================================================
        //  INIT
        //  ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            checkSession();

            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });
            });

            setTimeout(() => {
                if (!document.getElementById('loginOverlay').classList.contains('hidden')) {
                    document.getElementById('loginUsername').focus();
                }
            }, 500);
        });

        console.log('%c🚀 Kimi Notes', 'font-size:20px; font-weight:bold; color:#7eb8ff;');
        console.log('%c👤 Default users: admin/admin123, demo/demo123', 'font-size:14px; color:#8892b0;');
    </script>

</body>
