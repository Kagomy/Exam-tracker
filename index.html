<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIMI Exam Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ========================================
                   RESET & BASE
                ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0b0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========================================
                   HEADER
                ======================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #1a2332;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #2a3a55;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 36px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text small {
            font-size: 16px;
            font-weight: 400;
            -webkit-text-fill-color: #b0c4de;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111827;
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid #2a3a55;
        }

        .stat-item .label {
            font-size: 11px;
            color: #b0c4de;
        }

        .stat-item .value {
            font-size: 20px;
            font-weight: 900;
            color: #00d2ff;
        }

        .btn-export,
        .btn-import {
            background: #2a3a55;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-export:hover,
        .btn-import:hover {
            background: #3b4e6b;
            transform: scale(1.05);
        }

        /* ========================================
                   SUBJECTS
                ======================================== */
        .subjects-section h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #f0c27f;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .subject-card {
            background: #1a2332;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a3a55;
            transition: 0.3s;
            cursor: pointer;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1);
        }

        .subject-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: transparent;
            border: none;
            padding: 0;
        }

        .subject-card .name {
            font-size: 20px;
            font-weight: 900;
        }

        .subject-card .emoji {
            font-size: 32px;
        }

        .subject-card .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .subject-card .stats .s {
            background: #111827;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
        }

        .subject-card .stats .s .num {
            font-size: 20px;
            font-weight: 900;
            color: #00d2ff;
        }

        .subject-card .stats .s .lbl {
            font-size: 12px;
            color: #b0c4de;
        }

        .subject-card .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a3a55;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .subject-card .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #f0c27f, #fc5c7d);
            transition: width 0.5s ease;
        }

        .subject-card .rank {
            font-size: 14px;
            font-weight: 700;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .rank-master {
            background: #f0c27f44;
            color: #f0c27f;
        }
        .rank-excellent {
            background: #00d2ff44;
            color: #00d2ff;
        }
        .rank-strong {
            background: #4ade8044;
            color: #4ade80;
        }
        .rank-building {
            background: #fc5c7d44;
            color: #fc5c7d;
        }

        .btn-add-subject {
            background: #2a3a55;
            border: 2px dashed #3b4e6b;
            color: #b0c4de;
            padding: 16px 30px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .btn-add-subject:hover {
            background: #3b4e6b;
            border-color: #00d2ff;
            color: #fff;
        }

        /* ========================================
                   STATS CARDS
                ======================================== */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a2332;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2a3a55;
        }

        .stat-card .icon {
            font-size: 32px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 900;
            display: block;
            color: #f0c27f;
            margin: 8px 0;
        }

        .stat-card .lbl {
            font-size: 14px;
            color: #b0c4de;
        }

        /* ========================================
                   BADGES
                ======================================== */
        .badges-section h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #f0c27f;
        }

        .badges-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .badge-item {
            background: #1a2332;
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid #2a3a55;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .badge-item.unlocked {
            border-color: #f0c27f;
            background: #f0c27f22;
            color: #f0c27f;
        }

        .badge-item.locked {
            opacity: 0.4;
            filter: grayscale(1);
        }

        /* ========================================
                   ANALYSIS
                ======================================== */
        .analysis-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            background: #1a2332;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a3a55;
        }

        .chart-container h3 {
            color: #f0c27f;
            margin-bottom: 12px;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .chart-bar .lbl {
            width: 80px;
            font-size: 14px;
            text-align: right;
        }

        .chart-bar .line {
            flex: 1;
            height: 14px;
            background: #2a3a55;
            border-radius: 20px;
            overflow: hidden;
        }

        .chart-bar .fill {
            height: 100%;
            border-radius: 20px;
            width: 0%;
            transition: width 1s ease;
            background: linear-gradient(90deg, #f0c27f, #fc5c7d);
        }

        .chart-bar .pct {
            font-size: 14px;
            font-weight: 700;
            width: 45px;
            text-align: left;
        }

        .weak-topics-container {
            background: #1a2332;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a3a55;
        }

        .weak-topics-container h3 {
            color: #fc5c7d;
            margin-bottom: 12px;
        }

        #weakTopicsList {
            list-style: none;
        }

        #weakTopicsList li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #111827;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            border-right: 3px solid #fc5c7d;
        }

        /* ========================================
                   MODAL
                ======================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a2332;
            padding: 30px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2a3a55;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            left: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #b0c4de;
            transition: 0.3s;
        }

        .modal-close:hover {
            color: #fc5c7d;
            transform: rotate(90deg);
        }

        .modal-content h2 {
            color: #f0c27f;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
            color: #b0c4de;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a3a55;
            background: #111827;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d2ff;
        }

        .btn-submit {
            background: linear-gradient(135deg, #fc5c7d, #6a82fb);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px #fc5c7d55;
        }

        /* ========================================
                   TEST LIST INSIDE SUBJECT
                ======================================== */
        .test-list {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: #111827;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 14px;
            border-right: 3px solid #00d2ff;
        }

        .test-item .status-done {
            color: #4ade80;
        }
        .test-item .status-planned {
            color: #f0c27f;
        }
        .test-item .status-review {
            color: #fc5c7d;
        }

        .btn-delete-test {
            background: none;
            border: none;
            color: #fc5c7d;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-delete-subject {
            background: none;
            border: none;
            color: #fc5c7d;
            cursor: pointer;
            font-size: 20px;
            padding: 0 8px;
        }

        /* ========================================
                   SCROLLBAR
                ======================================== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a55;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b4e6b;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- =================== HEADER =================== -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">KIMI <small>Exam Tracker</small></span>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="label">XP</span>
                    <span class="value" id="totalXP">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Level</span>
                    <span class="value" id="totalLevel">1</span>
                </div>
                <button class="btn-export" onclick="exportData()">📤 تصدير</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">📥 استيراد</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
            </div>
        </header>

        <!-- =================== SUBJECTS =================== -->
        <section class="subjects-section">
            <h2>📊 المواد</h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
            <button class="btn-add-subject" onclick="addSubject()">➕ إضافة مادة جديدة</button>
        </section>

        <!-- =================== STATS =================== -->
        <section class="stats-section">
            <div class="stats-cards">
                <div class="stat-card">
                    <span class="icon">📝</span>
                    <span class="number" id="totalTests">0</span>
                    <span class="lbl">إجمالي الاختبارات</span>
                </div>
                <div class="stat-card">
                    <span class="icon">✅</span>
                    <span class="number" id="completedTests">0</span>
                    <span class="lbl">مكتملة</span>
                </div>
                <div class="stat-card">
                    <span class="icon">📈</span>
                    <span class="number" id="overallAverage">0%</span>
                    <span class="lbl">المعدل العام</span>
                </div>
                <div class="stat-card">
                    <span class="icon">🏆</span>
                    <span class="number" id="badgesCount">0</span>
                    <span class="lbl">الشارات</span>
                </div>
            </div>
        </section>

        <!-- =================== BADGES =================== -->
        <section class="badges-section">
            <h2>🏅 الشارات</h2>
            <div class="badges-grid" id="badgesGrid"></div>
        </section>

        <!-- =================== ANALYSIS =================== -->
        <section class="analysis-section">
            <div class="analysis-grid">
                <div class="chart-container">
                    <h3>📊 توزيع الأداء</h3>
                    <div id="performanceChart"></div>
                </div>
                <div class="weak-topics-container">
                    <h3>⚠️ المواضيع الضعيفة</h3>
                    <ul id="weakTopicsList">
                        <li style="color:#b0c4de; text-align:center;">لا توجد بيانات كافية</li>
                    </ul>
                </div>
            </div>
        </section>

    </div>

    <!-- =================== MODAL =================== -->
    <div class="modal" id="testModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>➕ إضافة اختبار جديد</h2>
            <form id="testForm" onsubmit="addTest(event)">
                <input type="hidden" id="subjectName" />
                <div class="form-group">
                    <label>المادة</label>
                    <input type="text" id="testSubject" readonly />
                </div>
                <div class="form-group">
                    <label>عنوان الاختبار</label>
                    <input type="text" id="testTitle" required placeholder="مثل: اختبار النحو" />
                </div>
                <div class="form-group">
                    <label>الموضوع</label>
                    <input type="text" id="testTopic" placeholder="مثل: النحو" />
                </div>
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="testDate" required />
                </div>
                <div class="form-group">
                    <label>الدرجة الكلية</label>
                    <input type="number" id="testTotal" required placeholder="مثل: 50" step="0.1" />
                </div>
                <div class="form-group">
                    <label>درجتك</label>
                    <input type="number" id="testScore" required placeholder="مثل: 45" step="0.1" />
                </div>
                <div class="form-group">
                    <label>الحالة</label>
                    <select id="testStatus">
                        <option value="Done">✅ Done</option>
                        <option value="Planned">📅 Planned</option>
                        <option value="Review">🔄 Review</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الأخطاء</label>
                    <input type="text" id="testMistakes" placeholder="مثل: Grammar, Spelling" />
                </div>
                <div class="form-group">
                    <label>الموضوع الضعيف</label>
                    <input type="text" id="testWeakTopic" placeholder="مثل: Grammar" />
                </div>
                <button type="submit" class="btn-submit">💾 حفظ الاختبار</button>
            </form>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ======================== SCRIPT ============================= -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  DATA LAYER  (المخزن)
        // ============================================================
        let data = {
            subjects: {} // { "Arabic": { emoji: "🇪🇬", tests: [ { title, topic, date, total, score, status, mistakes, weakTopic }, ... ] } }
        };

        const BADGES_DEF = [
            { id: 'first', label: '🌱 First Step', condition: (d) => getTotalTests(d) >= 1 },
            { id: 'warrior', label: '🔥 Test Warrior', condition: (d) => getTotalTests(d) >= 5 },
            { id: 'ninety', label: '🏆 90% Club', condition: (d) => getOverallAvg(d) >= 0.9 },
            { id: 'master', label: '👑 Academic Master', condition: (d) => getTotalTests(d) >= 20 },
        ];

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadFromStorage();
            renderAll();
            // حفظ تلقائي كل 5 ثواني
            setInterval(saveToStorage, 5000);
        }

        // ============================================================
        //  STORAGE  (السيف بتاع الداتا 🔒)
        // ============================================================
        function saveToStorage() {
            try {
                localStorage.setItem('kimiTrackerData', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem('kimiTrackerData');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // تأكد من وجود subjects
                    if (parsed.subjects) {
                        data = parsed;
                        return;
                    }
                }
            } catch (e) { /* ignore */ }
            // البيانات الافتراضية
            data = {
                subjects: {
                    'العربية': {
                        emoji: '🇪🇬',
                        tests: [
                            { title: 'اختبار النحو', topic: 'النحو', date: '2026-01-15', total: 50, score: 45,
                                status: 'Done', mistakes: 'إعراب', weakTopic: 'النحو' },
                            { title: 'اختبار البلاغة', topic: 'البلاغة', date: '2026-01-22', total: 50, score: 40,
                                status: 'Done', mistakes: 'تشبيه', weakTopic: 'البلاغة' }
                        ]
                    },
                    'English': {
                        emoji: '🇬🇧',
                        tests: [
                            { title: 'Grammar Test', topic: 'Grammar', date: '2026-01-10', total: 60, score: 50,
                                status: 'Done', mistakes: 'Tenses', weakTopic: 'Grammar' }
                        ]
                    },
                    'Programming': {
                        emoji: '💻',
                        tests: [
                            { title: 'JavaScript Quiz', topic: 'JS', date: '2026-01-12', total: 40, score: 35,
                                status: 'Done', mistakes: 'Closures', weakTopic: 'JS' }
                        ]
                    },
                    'History': {
                        emoji: '🏛️',
                        tests: []
                    }
                }
            };
            saveToStorage();
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kimi_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.subjects) {
                        data = imported;
                        saveToStorage();
                        renderAll();
                        alert('✅ تم استيراد البيانات بنجاح!');
                    } else {
                        alert('❌ ملف غير صالح');
                    }
                } catch (err) {
                    alert('❌ خطأ في قراءة الملف');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function getTestsForSubject(subject) {
            return data.subjects[subject]?.tests || [];
        }

        function getTotalTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                count += dataObj.subjects[s].tests.length;
            }
            return count;
        }

        function getCompletedTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') count++;
                }
            }
            return count;
        }

        function getOverallAvg(dataObj) {
            let total = 0,
                count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.total > 0) {
                        total += (t.score / t.total);
                        count++;
                    }
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectAvg(subject) {
            const tests = getTestsForSubject(subject);
            let total = 0,
                count = 0;
            for (const t of tests) {
                if (t.total > 0) {
                    total += (t.score / t.total);
                    count++;
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectProgress(subject) {
            const tests = getTestsForSubject(subject);
            if (tests.length === 0) return 0;
            let done = 0;
            for (const t of tests) {
                if (t.status === 'Done') done++;
            }
            return done / tests.length;
        }

        function getTotalXP(dataObj) {
            let xp = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') {
                        xp += Math.round((t.score / t.total) * 100);
                    }
                }
            }
            return xp;
        }

        function getLevel(xp) {
            return 1 + Math.floor(xp / 500);
        }

        function getRank(avg) {
            if (avg >= 0.9) return { label: '🏆 Master', cls: 'rank-master' };
            if (avg >= 0.8) return { label: '🥇 Excellent', cls: 'rank-excellent' };
            if (avg >= 0.7) return { label: '🥈 Strong', cls: 'rank-strong' };
            return { label: '🌱 Building', cls: 'rank-building' };
        }

        function getBadges(dataObj) {
            const result = [];
            const totalTests = getTotalTests(dataObj);
            const avg = getOverallAvg(dataObj);
            for (const b of BADGES_DEF) {
                let unlocked = false;
                if (b.id === 'first') unlocked = totalTests >= 1;
                else if (b.id === 'warrior') unlocked = totalTests >= 5;
                else if (b.id === 'ninety') unlocked = avg >= 0.9;
                else if (b.id === 'master') unlocked = totalTests >= 20;
                result.push({ ...b, unlocked });
            }
            return result;
        }

        function getWeakTopics(dataObj) {
            const map = {};
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.weakTopic && t.weakTopic.trim()) {
                        const key = t.weakTopic.trim();
                        if (!map[key]) map[key] = { count: 0, avgScore: 0, totalScores: 0, countScores: 0 };
                        map[key].count++;
                        if (t.total > 0) {
                            map[key].totalScores += (t.score / t.total);
                            map[key].countScores++;
                        }
                    }
                }
            }
            const result = [];
            for (const key in map) {
                const avg = map[key].countScores > 0 ? map[key].totalScores / map[key].countScores : 0;
                result.push({ topic: key, count: map[key].count, avgScore: avg });
            }
            result.sort((a, b) => a.avgScore - b.avgScore || b.count - a.count);
            return result.slice(0, 5);
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderAll() {
            renderSubjects();
            renderStats();
            renderBadges();
            renderAnalysis();
            renderHeaderStats();
        }

        function renderSubjects() {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';
            for (const [name, sub] of Object.entries(data.subjects)) {
                const tests = sub.tests;
                const avg = getSubjectAvg(name);
                const progress = getSubjectProgress(name);
                const rank = getRank(avg);
                const doneCount = tests.filter(t => t.status === 'Done').length;

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                            <div class="header">
                                <span class="name">${sub.emoji || '📚'} ${name}</span>
                                <span>
                                    <button class="btn-delete-subject" onclick="deleteSubject('${name}')" title="حذف المادة">🗑️</button>
                                </span>
                            </div>
                            <div class="stats">
                                <div class="s"><span class="num">${tests.length}</span><span class="lbl">اختبارات</span></div>
                                <div class="s"><span class="num">${doneCount}</span><span class="lbl">مكتملة</span></div>
                                <div class="s"><span class="num">${(avg * 100).toFixed(0)}%</span><span class="lbl">المعدل</span></div>
                                <div class="s"><span class="num">${(progress * 100).toFixed(0)}%</span><span class="lbl">تقدم</span></div>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress * 100}%;"></div></div>
                            <span class="rank ${rank.cls}">${rank.label}</span>
                            <div class="test-list">
                                ${tests.slice().reverse().slice(0, 5).map(t => `
                                    <div class="test-item">
                                        <span>${t.title}</span>
                                        <span>
                                            <span class="status-${t.status.toLowerCase()}">${t.status}</span>
                                            <button class="btn-delete-test" onclick="deleteTest('${name}', '${t.title}')">✕</button>
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="openModal('${name}')" style="margin-top:10px; background:#00d2ff22; border:1px solid #00d2ff; color:#00d2ff; padding:6px 16px; border-radius:10px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700;">➕ اختبار</button>
                        `;
                grid.appendChild(card);
            }
        }

        function renderStats() {
            const total = getTotalTests(data);
            const completed = getCompletedTests(data);
            const avg = getOverallAvg(data);
            const badges = getBadges(data);
            document.getElementById('totalTests').textContent = total;
            document.getElementById('completedTests').textContent = completed;
            document.getElementById('overallAverage').textContent = (avg * 100).toFixed(0) + '%';
            document.getElementById('badgesCount').textContent = badges.filter(b => b.unlocked).length;
        }

        function renderHeaderStats() {
            const xp = getTotalXP(data);
            const level = getLevel(xp);
            document.getElementById('totalXP').textContent = xp;
            document.getElementById('totalLevel').textContent = level;
        }

        function renderBadges() {
            const grid = document.getElementById('badgesGrid');
            const badges = getBadges(data);
            grid.innerHTML = badges.map(b =>
                `<div class="badge-item ${b.unlocked ? 'unlocked' : 'locked'}">${b.label}</div>`
            ).join('');
        }

        function renderAnalysis() {
            // Performance Chart
            const chart = document.getElementById('performanceChart');
            const avg = getOverallAvg(data);
            const weak = getWeakTopics(data);

            const ranges = [
                { label: 'Excellent', min: 0.9, max: 1, color: '#4ade80' },
                { label: 'Good', min: 0.7, max: 0.9, color: '#00d2ff' },
                { label: 'Average', min: 0.5, max: 0.7, color: '#f0c27f' },
                { label: 'Weak', min: 0, max: 0.5, color: '#fc5c7d' },
            ];

            // حساب توزيع الاختبارات
            let dist = { Excellent: 0, Good: 0, Average: 0, Weak: 0 };
            let totalTests = 0;
            for (const s in data.subjects) {
                for (const t of data.subjects[s].tests) {
                    if (t.total > 0) {
                        const pct = t.score / t.total;
                        if (pct >= 0.9) dist.Excellent++;
                        else if (pct >= 0.7) dist.Good++;
                        else if (pct >= 0.5) dist.Average++;
                        else dist.Weak++;
                        totalTests++;
                    }
                }
            }

            if (totalTests === 0) {
                chart.innerHTML = '<p style="color:#b0c4de; text-align:center; padding:20px;">لا توجد اختبارات لعرضها</p>';
            } else {
                chart.innerHTML = `
                            ${Object.entries(dist).map(([label, count]) => {
                                const pct = totalTests > 0 ? (count / totalTests) * 100 : 0;
                                return `
                                    <div class="chart-bar">
                                        <span class="lbl">${label}</span>
                                        <div class="line"><div class="fill" style="width:${pct}%; background:${ranges.find(r=>r.label===label)?.color || '#fff'};"></div></div>
                                        <span class="pct">${pct.toFixed(0)}%</span>
                                    </div>
                                `;
                            }).join('')}
                            <div style="margin-top:12px; text-align:center; color:#b0c4de; font-size:14px;">
                                المعدل العام: <strong style="color:#f0c27f;">${(avg * 100).toFixed(0)}%</strong>
                            </div>
                        `;
            }

            // Weak Topics
            const list = document.getElementById('weakTopicsList');
            if (weak.length === 0) {
                list.innerHTML = '<li style="color:#b0c4de; text-align:center; border-right:none;">✨ مفيش مواضيع ضعيفة! استمر 💪</li>';
            } else {
                list.innerHTML = weak.map(w =>
                    `<li><span>${w.topic}</span><span style="color:#fc5c7d;">${(w.avgScore * 100).toFixed(0)}%</span></li>`
                ).join('');
            }
        }

        // ============================================================
        //  ACTIONS
        // ============================================================
        function openModal(subject) {
            document.getElementById('subjectName').value = subject;
            document.getElementById('testSubject').value = subject;
            document.getElementById('testTitle').value = '';
            document.getElementById('testTopic').value = '';
            document.getElementById('testDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('testTotal').value = '';
            document.getElementById('testScore').value = '';
            document.getElementById('testStatus').value = 'Done';
            document.getElementById('testMistakes').value = '';
            document.getElementById('testWeakTopic').value = '';
            document.getElementById('testModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('testModal').classList.remove('show');
        }

        function addTest(e) {
            e.preventDefault();
            const subject = document.getElementById('subjectName').value;
            const title = document.getElementById('testTitle').value.trim();
            const topic = document.getElementById('testTopic').value.trim();
            const date = document.getElementById('testDate').value;
            const total = parseFloat(document.getElementById('testTotal').value);
            const score = parseFloat(document.getElementById('testScore').value);
            const status = document.getElementById('testStatus').value;
            const mistakes = document.getElementById('testMistakes').value.trim();
            const weakTopic = document.getElementById('testWeakTopic').value.trim();

            if (!subject || !title || !date || isNaN(total) || isNaN(score)) {
                alert('❌ يرجى ملء جميع الحقول المطلوبة');
                return;
            }

            if (!data.subjects[subject]) {
                data.subjects[subject] = { emoji: '📚', tests: [] };
            }

            data.subjects[subject].tests.push({
                title,
                topic,
                date,
                total,
                score,
                status,
                mistakes,
                weakTopic
            });

            saveToStorage();
            renderAll();
            closeModal();
        }

        function deleteTest(subject, title) {
            if (!confirm(`❌ هل تريد حذف الاختبار "${title}"؟`)) return;
            const tests = data.subjects[subject]?.tests || [];
            data.subjects[subject].tests = tests.filter(t => t.title !== title);
            saveToStorage();
            renderAll();
        }

        function deleteSubject(subject) {
            if (!confirm(`❌ هل تريد حذف المادة "${subject}" وجميع اختباراتها؟`)) return;
            delete data.subjects[subject];
            saveToStorage();
            renderAll();
        }

        function addSubject() {
            const name = prompt('📚 أدخل اسم المادة الجديدة:');
            if (!name || name.trim() === '') return;
            const emoji = prompt('🎨 أدخل إيموجي للمادة (اختياري):') || '📚';
            if (data.subjects[name.trim()]) {
                alert('❌ هذه المادة موجودة بالفعل');
                return;
            }
            data.subjects[name.trim()] = { emoji, tests: [] };
            saveToStorage();
            renderAll();
        }

        // ============================================================
        //  START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);

        // إغلاق المودال بالضغط خارج المحتوى
        document.getElementById('testModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>

</body>
</html>
