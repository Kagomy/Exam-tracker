<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Notes – Space Exam Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           RESET & BASE – SPACE GALAXY VIBE 🌌
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f0f4ff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Galaxy Background with Nebula Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(88, 50, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 50, 150, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(255, 100, 50, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 70%, rgba(150, 50, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: nebulaPulse 8s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Shooting Stars */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.3);
            animation: shoot var(--duration) linear infinite;
            opacity: 0;
            z-index: 0;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 80px;
            height: 1px;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.8), transparent);
            transform: translateY(-50%);
        }

        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            15% {
                opacity: 1;
            }
            20% {
                opacity: 0;
                transform: translate(-300px, 300px) rotate(-45deg);
            }
            100% {
                opacity: 0;
            }
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           GLASSMORPHISM UTILITY
           ============================================================ */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(126, 184, 255, 0.05), transparent 60%);
            pointer-events: none;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            font-size: 38px;
            filter: drop-shadow(0 0 30px rgba(100, 150, 255, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 4s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .logo-text small {
            font-size: 14px;
            font-weight: 400;
            -webkit-text-fill-color: #8892b0;
            letter-spacing: 1px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .stat-pill .num {
            color: #7eb8ff;
            font-weight: 900;
            font-size: 18px;
        }

        .btn-export,
        .btn-import,
        .btn-memories {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ccd6f6;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-export:hover,
        .btn-import:hover,
        .btn-memories:hover {
            background: rgba(126, 184, 255, 0.15);
            border-color: #7eb8ff;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(126, 184, 255, 0.1);
        }

        /* ============================================================
           SUBJECTS
           ============================================================ */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ccd6f6;
            letter-spacing: -0.3px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #7eb8ff, #a78bfa, transparent);
        }

        .section-title span {
            color: #7eb8ff;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 22px;
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(126, 184, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        .subject-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(126, 184, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(126, 184, 255, 0.05);
        }

        .subject-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .subject-card .name {
            font-size: 20px;
            font-weight: 700;
            color: #f0f4ff;
        }

        .subject-card .emoji {
            font-size: 30px;
            filter: drop-shadow(0 0 15px rgba(126, 184, 255, 0.2));
        }

        .subject-card .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
            position: relative;
            z-index: 1;
        }

        .subject-card .stats-grid .s {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .subject-card .stats-grid .s .num {
            font-size: 20px;
            font-weight: 900;
            color: #7eb8ff;
            display: block;
        }

        .subject-card .stats-grid .s .lbl {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subject-card .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .subject-card .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7eb8ff, #a78bfa, #f472b6);
            background-size: 200% 200%;
            animation: progressGradient 3s ease-in-out infinite;
            transition: width 0.6s ease;
        }

        @keyframes progressGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subject-card .rank {
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-block;
            position: relative;
            z-index: 1;
        }

        .rank-master {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
            animation: glowPulse 2s ease-in-out infinite;
        }
        .rank-excellent {
            background: rgba(126, 184, 255, 0.2);
            color: #7eb8ff;
            border: 1px solid rgba(126, 184, 255, 0.2);
        }
        .rank-strong {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .rank-building {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(167, 139, 250, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(167, 139, 250, 0.3);
            }
        }

        .test-list {
            margin-top: 12px;
            max-height: 180px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            border-left: 2px solid #7eb8ff;
        }

        .test-item .status-Done {
            color: #34d399;
        }
        .test-item .status-Planned {
            color: #fbbf24;
        }
        .test-item .status-Review {
            color: #f87171;
        }

        .btn-delete-test {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.5;
            transition: 0.3s;
        }

        .btn-delete-test:hover {
            opacity: 1;
        }

        .btn-delete-subject {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.3;
            transition: 0.3s;
        }

        .btn-delete-subject:hover {
            opacity: 1;
        }

        .btn-add-subject {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            color: #8892b0;
            padding: 16px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .btn-add-subject:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #7eb8ff;
            color: #f0f4ff;
        }

        .btn-add-test {
            background: rgba(126, 184, 255, 0.08);
            border: 1px solid rgba(126, 184, 255, 0.15);
            color: #7eb8ff;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .btn-add-test:hover {
            background: rgba(126, 184, 255, 0.15);
            transform: scale(1.02);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(126, 184, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        .stat-card:hover {
            border-color: rgba(126, 184, 255, 0.2);
            transform: translateY(-4px);
        }

        .stat-card .icon {
            font-size: 28px;
            display: block;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 900;
            display: block;
            color: #7eb8ff;
            margin: 6px 0;
        }

        .stat-card .lbl {
            font-size: 12px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           BADGES
           ============================================================ */
        .badges-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .badge-item.unlocked {
            border-color: rgba(167, 139, 250, 0.3);
            background: rgba(167, 139, 250, 0.08);
            color: #c4b5fd;
            animation: badgeGlow 2s ease-in-out infinite;
        }

        @keyframes badgeGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(167, 139, 250, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(167, 139, 250, 0.2);
            }
        }

        .badge-item.locked {
            opacity: 0.3;
            filter: grayscale(0.8);
        }

        /* ============================================================
           ANALYSIS
           ============================================================ */
        .analysis-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .chart-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 30%, rgba(126, 184, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        .chart-container h3 {
            color: #ccd6f6;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
            position: relative;
            z-index: 1;
        }

        .chart-bar .lbl {
            width: 80px;
            font-size: 13px;
            font-weight: 600;
            color: #8892b0;
            text-align: right;
        }

        .chart-bar .line {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
        }

        .chart-bar .fill {
            height: 100%;
            border-radius: 20px;
            width: 0%;
            transition: width 1s ease;
        }

        .chart-bar .pct {
            font-size: 13px;
            font-weight: 700;
            width: 45px;
            text-align: left;
            color: #ccd6f6;
        }

        .weak-topics-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .weak-topics-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 60%, rgba(248, 113, 113, 0.05), transparent 60%);
            pointer-events: none;
        }

        .weak-topics-container h3 {
            color: #f87171;
            margin-bottom: 14px;
            font-weight: 600;
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        #weakTopicsList {
            list-style: none;
            position: relative;
            z-index: 1;
        }

        #weakTopicsList li {
            padding: 8px 14px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            border-right: 2px solid #f87171;
            font-size: 14px;
        }

        #weakTopicsList li .topic {
            color: #ccd6f6;
        }
        #weakTopicsList li .pct {
            color: #f87171;
            font-weight: 700;
        }

        /* ============================================================
           MEMORIES SECTION
           ============================================================ */
        .memories-section {
            margin-bottom: 30px;
        }

        .memories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .memory-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px;
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .memory-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(167, 139, 250, 0.05);
        }

        .memory-card .memory-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #8892b0;
        }

        .memory-card .memory-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .memory-card .memory-title {
            font-weight: 700;
            font-size: 16px;
            color: #f0f4ff;
            margin-bottom: 4px;
        }

        .memory-card .memory-date {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .memory-card .memory-note {
            font-size: 13px;
            color: #ccd6f6;
            opacity: 0.8;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-delete-memory {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete-memory:hover {
            background: rgba(248, 113, 113, 0.2);
            transform: scale(1.1);
        }

        .btn-add-memory {
            background: rgba(167, 139, 250, 0.08);
            border: 2px dashed rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            padding: 30px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;

</head>
<body>

    <!-- Stars Container -->
    <div class="stars" id="starsContainer"></div>

    <!-- Shooting Stars -->
    <div id="shootingStarsContainer"></div>

    <div class="app-container">

        <!-- =================== HEADER =================== -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <span class="logo-text">
                    <span class="highlight">Kimi</span> Notes

            <div class="header-stats">

        <!-- =================== STATS =================== -->
        <section>

                <div class="stat-card">
                    <span class="icon">📝</span>

        <!-- =================== BADGES =================== -->

        <!-- =================== ANALYSIS =================== -->
        <section>

                    <div id="performanceChart"></div>
                </div>
                <div class="weak-topics-container">
                    <h3>⚠️ Weak Topics</h3>
                    <ul id="weakTopicsList">
                        <li style="color:#8892b0; text-align:center; border-right:none;">No data yet</li>

        <!-- =================== MEMORIES =================== -->
        <section class="memories-section" id="memoriesSection">
            <h2 class="section-title">📦 <span>Memory Box</span></h2>

            <button class="btn-add-memory" onclick="openMemoryModal()">

    </div>

    <!-- =================== TEST MODAL =================== -->
    <div class="modal" id="testModal">

    <!-- =================== MEMORY MODAL =================== -->
    <div class="modal" id="memoryModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('memoryModal')">✕</span>
            <h2>🌟 New Memory</h2>
            <form id="memoryForm" onsubmit="addMemory(event)">

                    <input type="date" id="memoryDate" required />
                </div>
                <div class="form-group">
                    <label>Image URL (optional)</label>
                    <input type="url" id="memoryImage" placeholder="https://example.com/photo.jpg" />
                </div>

                    <label>Note / Story</label>

    <!-- ============================================================ -->
    <!-- ======================== SCRIPT ============================= -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  DATA LAYER
        // ============================================================
        let data = {
            subjects: {},
            memories: []
        };

        const BADGES_DEF = [
            { id: 'first', label: '🌱 First Step', condition: (d) => getTotalTests(d) >= 1 },
            { id: 'warrior', label: '🔥 Test Warrior', condition: (d) => getTotalTests(d) >= 5 },
            { id: 'ninety', label: '🏆 90% Club', condition: (d) => getOverallAvg(d) >= 0.9 },
            { id: 'master', label: '👑 Academic Master', condition: (d) => getTotalTests(d) >= 20 },
        ];

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            createStars();
            createShootingStars();
            loadFromStorage();
            renderAll();
            setInterval(saveToStorage, 5000);
        }

        // ============================================================
        //  STARS & SPACE EFFECTS
        // ============================================================
        function createStars() {
            const container = document.getElementById('starsContainer');
            const count = 150;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        function createShootingStars() {
            const container = document.getElementById('shootingStarsContainer');
            const count = 3;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.left = (Math.random() * 60 + 10) + '%';
                star.style.top = (Math.random() * 40 + 5) + '%';
                star.style.setProperty('--duration', (Math.random() * 8 + 6) + 's');
                star.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(star);
            }
        }

        // ============================================================
        //  STORAGE
        // ============================================================
        function saveToStorage() {
            try {
                localStorage.setItem('kimiTrackerData', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem('kimiTrackerData');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.subjects !== undefined) {
                        data = parsed;
                        if (!data.memories) data.memories = [];
                        return;
                    }
                }
            } catch (e) { /* ignore */ }

            data = {
                subjects: {},
                memories: []
            };
            saveToStorage();
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kimi_backup_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.subjects !== undefined) {
                        data = imported;
                        if (!data.memories) data.memories = [];
                        saveToStorage();
                        renderAll();
                        alert('✅ Data imported successfully!');
                    } else {
                        alert('❌ Invalid file');
                    }
                } catch (err) {
                    alert('❌ Error reading file');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function getTestsForSubject(subject) {
            return data.subjects[subject]?.tests || [];
        }

        function getTotalTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                count += dataObj.subjects[s].tests.length;
            }
            return count;
        }

        function getCompletedTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') count++;
                }
            }
            return count;
        }

        function getOverallAvg(dataObj) {
            let total = 0,
                count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.total > 0) {
                        total += (t.score / t.total);
                        count++;
                    }
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectAvg(subject) {
            const tests = getTestsForSubject(subject);
            let total = 0,
                count = 0;
            for (const t of tests) {
                if (t.total > 0) {
                    total += (t.score / t.total);
                    count++;
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectProgress(subject) {
            const tests = getTestsForSubject(subject);
            if (tests.length === 0) return 0;
            let done = 0;
            for (const t of tests) {
                if (t.status === 'Done') done++;
            }
            return done / tests.length;
        }

        function getTotalXP(dataObj) {
            let xp = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') {
                        xp += Math.round((t.score / t.total) * 100);
                    }
                }
            }
            return xp;
        }

        function getLevel(xp) {
            return 1 + Math.floor(xp / 500);
        }

        function getRank(avg) {
            if (avg >= 0.9) return { label: '🏆 Master', cls: 'rank-master' };
            if (avg >= 0.8) return { label: '🥇 Excellent', cls: 'rank-excellent' };
            if (avg >= 0.7) return { label: '🥈 Strong', cls: 'rank-strong' };
            return { label: '🌱 Building', cls: 'rank-building' };
        }

        function getBadges(dataObj) {
            const result = [];
            const totalTests = getTotalTests(dataObj);
            const avg = getOverallAvg(dataObj);
            for (const b of BADGES_DEF) {
                let unlocked = false;
                if (b.id === 'first') unlocked = totalTests >= 1;
                else if (b.id === 'warrior') unlocked = totalTests >= 5;
                else if (b.id === 'ninety') unlocked = avg >= 0.9;
                else if (b.id === 'master') unlocked = totalTests >= 20;
                result.push({ ...b, unlocked });
            }
            return result;
        }

        function getWeakTopics(dataObj) {
            const map = {};
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.weakTopic && t.weakTopic.trim()) {
                        const key = t.weakTopic.trim();
                        if (!map[key]) map[key] = { count: 0, avgScore: 0, totalScores: 0, countScores: 0 };
                        map[key].count++;
                        if (t.total > 0) {
                            map[key].totalScores += (t.score / t.total);
                            map[key].countScores++;
                        }
                    }
                }
            }
            const result = [];
            for (const key in map) {
                const avg = map[key].countScores > 0 ? map[key].totalScores / map[key].countScores : 0;
                result.push({ topic: key, count: map[key].count, avgScore: avg });
            }
            result.sort((a, b) => a.avgScore - b.avgScore || b.count - a.count);
            return result.slice(0, 5);
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderAll() {
            renderSubjects();
            renderStats();
            renderBadges();
            renderAnalysis();
            renderHeaderStats();
            renderMemories();
        }

        function renderSubjects() {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';

            const subjectNames = Object.keys(data.subjects);
            if (subjectNames.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <span class="big-emoji">🚀</span>
                                <h3>No subjects yet!</h3>
                                <p style="color: #8892b0;">Click "Add New Subject" to start tracking your exams.</p>
                            </div>
                        `;
                return;
            }

            for (const [name, sub] of Object.entries(data.subjects)) {
                const tests = sub.tests;
                const avg = getSubjectAvg(name);
                const progress = getSubjectProgress(name);
                const rank = getRank(avg);
                const doneCount = tests.filter(t => t.status === 'Done').length;

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                            <div class="card-header">
                                <span class="name">${sub.emoji || '📚'} ${name}</span>
                                <span>
                                    <button class="btn-delete-subject" onclick="deleteSubject('${name}')" title="Delete subject">🗑️</button>
                                </span>
                            </div>
                            <div class="stats-grid">
                                <div class="s"><span class="num">${tests.length}</span><span class="lbl">Tests</span></div>
                                <div class="s"><span class="num">${doneCount}</span><span class="lbl">Done</span></div>
                                <div class="s"><span class="num">${(avg * 100).toFixed(0)}%</span><span class="lbl">Avg</span></div>
                                <div class="s"><span class="num">${(progress * 100).toFixed(0)}%</span><span class="lbl">Progress</span></div>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress * 100}%;"></div></div>
                            <span class="rank ${rank.cls}">${rank.label}</span>
                            <div class="test-list">
                                ${tests.slice().reverse().slice(0, 5).map(t => `
                                    <div class="test-item">
                                        <span>${t.title}</span>
                                        <span>
                                            <span class="status-${t.status}">${t.status}</span>
                                            <button class="btn-delete-test" onclick="deleteTest('${name}', '${t.title}')">✕</button>
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn-add-test" onclick="openModal('testModal', '${name}')">+ Add Test</button>
                        `;
                grid.appendChild(card);
            }
        }

        function renderStats() {
            const total = getTotalTests(data);
            const completed = getCompletedTests(data);
            const avg = getOverallAvg(data);
            const badges = getBadges(data);
            document.getElementById('totalTests').textContent = total;
            document.getElementById('completedTests').textContent = completed;
            document.getElementById('overallAverage').textContent = (avg * 100).toFixed(0) + '%';
            document.getElementById('badgesCount').textContent = badges.filter(b => b.unlocked).length;
        }

        function renderHeaderStats() {
            const xp = getTotalXP(data);
            const level = getLevel(xp);
            document.getElementById('totalXP').textContent = xp;
            document.getElementById('totalLevel').textContent = level;
        }

        function renderBadges() {
            const grid = document.getElementById('badgesGrid');
            const badges = getBadges(data);
            grid.innerHTML = badges.map(b =>
                `<div class="badge-item ${b.unlocked ? 'unlocked' : 'locked'}">${b.label}</div>`
            ).join('');
        }

        function renderAnalysis() {
            const chart = document.getElementById('performanceChart');
            const avg = getOverallAvg(data);
            const weak = getWeakTopics(data);

            let dist = { Excellent: 0, Good: 0, Average: 0, Weak: 0 };
            let totalTests = 0;
            for (const s in data.subjects) {
                for (const t of data.subjects[s].tests) {
                    if (t.total > 0) {
                        const pct = t.score / t.total;
                        if (pct >= 0.9) dist.Excellent++;
                        else if (pct >= 0.7) dist.Good++;
                        else if (pct >= 0.5) dist.Average++;
                        else dist.Weak++;
                        totalTests++;
                    }
                }
            }

            const colors = {
                Excellent: '#34d399',
                Good: '#7eb8ff',
                Average: '#fbbf24',
                Weak: '#f87171'
            };

            if (totalTests === 0) {
                chart.innerHTML = '<p style="color:#8892b0; text-align:center; padding:20px;">No tests to display</p>';
            } else {
                chart.innerHTML = `
                            ${Object.entries(dist).map(([label, count]) => {
                                const pct = totalTests > 0 ? (count / totalTests) * 100 : 0;
                                return `
                                    <div class="chart-bar">
                                        <span class="lbl">${label}</span>
                                        <div class="line"><div class="fill" style="width:${pct}%; background:${colors[label]};"></div></div>
                                        <span class="pct">${pct.toFixed(0)}%</span>
                                    </div>
                                `;
                            }).join('')}
                            <div style="margin-top:14px; text-align:center; color:#8892b0; font-size:14px;">
                                Overall Average: <strong style="color:#7eb8ff;">${(avg * 100).toFixed(0)}%</strong>
                            </div>
                        `;
            }

            const list = document.getElementById('weakTopicsList');
            if (weak.length === 0) {
                list.innerHTML =
                    '<li style="color:#8892b0; text-align:center; border-right:none;">✨ No weak topics! Keep going 💪</li>';
            } else {
                list.innerHTML = weak.map(w =>
                    `<li><span class="topic">${w.topic}</span><span class="pct">${(w.avgScore * 100).toFixed(0)}%</span></li>`
                ).join('');
            }
        }

        function renderMemories() {
            const grid = document.getElementById('memoriesGrid');

            if (data.memories.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <span class="big-emoji">🌟</span>
                                <h3>No memories yet</h3>
                                <p style="color: #8892b0;">Start capturing your favorite moments!</p>
                            </div>
                        `;
                return;
            }

            grid.innerHTML = data.memories.map((memory, index) => `
                        <div class="memory-card">
                            <button class="btn-delete-memory" onclick="deleteMemory(${index})">✕</button>
                            <div class="memory-image">
                                ${memory.image ? `<img src="${memory.image}" alt="${memory.title}" />` : '📸'}
                            </div>
                            <div class="memory-title">${memory.title}</div>
                            <div class="memory-date">${memory.date ? new Date(memory.date).toLocaleDateString() : ''}</div>
                            <div class="memory-note">${memory.note || ''}</div>
                        </div>
                    `).join('');
        }

        // ============================================================
        //  MODAL FUNCTIONS
        // ============================================================
        function openModal(modalId, subject = '') {
            if (modalId === 'testModal') {
                document.getElementById('subjectName').value = subject;
                document.getElementById('testSubject').value = subject;
                document.getElementById('testTitle').value = '';
                document.getElementById('testTopic').value = '';
                document.getElementById('testDate').value = new Date().toISOString().slice(0, 10);
                document.getElementById('testTotal').value = '';
                document.getElementById('testScore').value = '';
                document.getElementById('testStatus').value = 'Done';
                document.getElementById('testMistakes').value = '';
                document.getElementById('testWeakTopic').value = '';
            }
            document.getElementById(modalId).classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function openMemoryModal() {
            document.getElementById('memoryTitle').value = '';
            document.getElementById('memoryDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('memoryImage').value = '';
            document.getElementById('memoryNote').value = '';
            document.getElementById('memoryModal').classList.add('show');
        }

        function scrollToMemories() {
            document.getElementById('memoriesSection').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        //  ACTIONS
        // ============================================================
        function addTest(e) {
            e.preventDefault();
            const subject = document.getElementById('subjectName').value;
            const title = document.getElementById('testTitle').value.trim();
            const topic = document.getElementById('testTopic').value.trim();
            const date = document.getElementById('testDate').value;
            const total = parseFloat(document.getElementById('testTotal').value);
            const score = parseFloat(document.getElementById('testScore').value);
            const status = document.getElementById('testStatus').value;
            const mistakes = document.getElementById('testMistakes').value.trim();
            const weakTopic = document.getElementById('testWeakTopic').value.trim();

            if (!subject || !title || !date || isNaN(total) || isNaN(score)) {
                alert('❌ Please fill all required fields');
                return;
            }

            if (!data.subjects[subject]) {
                data.subjects[subject] = { emoji: '📚', tests: [] };
            }

            data.subjects[subject].tests.push({
                title,
                topic,
                date,
                total,
                score,
                status,
                mistakes,
                weakTopic
            });

            saveToStorage();
            renderAll();
            closeModal('testModal');
        }

        function deleteTest(subject, title) {
            if (!confirm(`❌ Delete test "${title}"?`)) return;
            const tests = data.subjects[subject]?.tests || [];
            data.subjects[subject].tests = tests.filter(t => t.title !== title);
            saveToStorage();
            renderAll();
        }

        function deleteSubject(subject) {
            if (!confirm(`❌ Delete subject "${subject}" and all its tests?`)) return;
            delete data.subjects[subject];
            saveToStorage();
            renderAll();
        }

        function addSubject() {
            const name = prompt('📚 Enter subject name:');
            if (!name || name.trim() === '') return;
            const emoji = prompt('🎨 Enter an emoji for this subject (optional):') || '📚';
            if (data.subjects[name.trim()]) {
                alert('❌ Subject already exists');
                return;
            }
            data.subjects[name.trim()] = { emoji, tests: [] };
            saveToStorage();
            renderAll();
        }

        function addMemory(e) {
            e.preventDefault();
            const title = document.getElementById('memoryTitle').value.trim();
            const date = document.getElementById('memoryDate').value;
            const image = document.getElementById('memoryImage').value.trim();
            const note = document.getElementById('memoryNote').value.trim();

            if (!title || !date) {
                alert('❌ Please fill in title and date');
                return;
            }

            data.memories.push({
                title,
                date,
                image: image || '',
                note: note || ''
            });

            saveToStorage();
            renderAll();
            closeModal('memoryModal');
        }

        function deleteMemory(index) {
            if (!confirm('❌ Delete this memory?')) return;
            data.memories.splice(index, 1);
            saveToStorage();
            renderAll();
        }

        // ============================================================
        //  CLOSE MODALS ON BACKDROP CLICK
        // ============================================================
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // ============================================================
        //  START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
