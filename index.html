<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Notes – Admin System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           RESET & BASE – SPACE VIBE 🌌
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f0f4ff;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(88, 50, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 50, 150, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 200, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: nebulaPulse 8s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ============================================================
           LOGIN OVERLAY
           ============================================================ */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            transition: 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .login-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .login-box {
            background: rgba(20, 28, 50, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .login-box .icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 900;
            color: #f0f4ff;
            margin-bottom: 4px;
        }

        .login-box h1 .highlight {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 4s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .login-box .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-box .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .login-box .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: #8892b0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .login-box .form-group input:focus {
            outline: none;
            border-color: #7eb8ff;
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #7eb8ff, #a78bfa);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(126, 184, 255, 0.25);
        }

        .login-box .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: rgba(248, 113, 113, 0.08);
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.1);
        }

        .login-box .error-msg.show {
            display: block;
        }

        .login-box .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #4a5568;
        }

        /* ============================================================
           APP CONTAINER
           ============================================================ */
        #appContainer {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            font-size: 38px;
            filter: drop-shadow(0 0 30px rgba(100, 150, 255, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 4s ease-in-out infinite;
        }

        .logo-text small {
            font-size: 14px;
            font-weight: 400;
            -webkit-text-fill-color: #8892b0;
            letter-spacing: 1px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(126, 184, 255, 0.08);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(126, 184, 255, 0.1);
        }

        .user-badge .role {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            font-weight: 600;
        }

        .user-badge .role.admin {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .btn-logout {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.2);
            transform: translateY(-2px);
        }

        /* ============================================================
           ADMIN PANEL (Only visible to admin)
           ============================================================ */
        .admin-panel-container {
            display: none;
            margin-bottom: 30px;
        }

        .admin-panel-container.visible {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-panel-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(251, 191, 36, 0.15);
        }

        .admin-panel-box .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .admin-panel-box .panel-header h3 {
            color: #fbbf24;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-panel-box .panel-header .badge {
            font-size: 12px;
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .admin-panel-box .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .admin-panel-box .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        .admin-panel-box .form-group {
            margin-bottom: 12px;
        }

        .admin-panel-box .form-group label {
            color: #8892b0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 4px;
        }

        .admin-panel-box .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        .admin-panel-box .form-group input:focus {
            outline: none;
            border-color: #7eb8ff;
            background: rgba(255, 255, 255, 0.06);
        }

        .admin-panel-box .btn-admin {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .admin-panel-box .btn-admin:hover {
            transform: scale(1.02);
        }

        .admin-panel-box .btn-admin-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
        }

        .admin-panel-box .btn-admin-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
        }

        .admin-panel-box .btn-admin-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .admin-panel-box .user-list {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .admin-panel-box .user-list .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #8892b0;
            font-size: 13px;
        }

        .admin-panel-box .user-list .item .username {
            color: #7eb8ff;
            font-family: monospace;
        }

        .admin-panel-box .user-list .item .role-tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }

        .admin-panel-box .user-list .item .role-tag.admin-tag {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
        }

        .admin-panel-box .user-list .item .remove-btn {
            color: #f87171;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            transition: 0.3s;
            opacity: 0.5;
        }

        .admin-panel-box .user-list .item .remove-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .admin-panel-box .user-list .empty-msg {
            color: #4a5568;
            text-align: center;
            padding: 12px;
            font-size: 13px;
        }

        .admin-panel-box .stats {
            font-size: 12px;
            color: #4a5568;
            margin-top: 10px;
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        /* ============================================================
           SUBJECTS SECTION (Normal user features)
           ============================================================ */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ccd6f6;
            letter-spacing: -0.3px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #7eb8ff, #a78bfa, transparent);
        }

        .section-title span {
            color: #7eb8ff;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 22px;
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(126, 184, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(126, 184, 255, 0.05);
        }

        .subject-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .subject-card .name {
            font-size: 20px;
            font-weight: 700;
            color: #f0f4ff;
        }

        .subject-card .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
            position: relative;
            z-index: 1;
        }

        .subject-card .stats-grid .s {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .subject-card .stats-grid .s .num {
            font-size: 20px;
            font-weight: 900;
            color: #7eb8ff;
            display: block;
        }

        .subject-card .stats-grid .s .lbl {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subject-card .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .subject-card .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7eb8ff, #a78bfa, #f472b6);
            background-size: 200% 200%;
            animation: progressGradient 3s ease-in-out infinite;
            transition: width 0.6s ease;
        }

        @keyframes progressGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subject-card .rank {
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-block;
            position: relative;
            z-index: 1;
        }

        .rank-master {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
            animation: glowPulse 2s ease-in-out infinite;
        }
        .rank-excellent {
            background: rgba(126, 184, 255, 0.2);
            color: #7eb8ff;
            border: 1px solid rgba(126, 184, 255, 0.2);
        }
        .rank-strong {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .rank-building {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(167, 139, 250, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(167, 139, 250, 0.3);
            }
        }

        .test-list {
            margin-top: 12px;
            max-height: 180px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            border-left: 2px solid #7eb8ff;
        }

        .test-item .status-Done {
            color: #34d399;
        }
        .test-item .status-Planned {
            color: #fbbf24;
        }
        .test-item .status-Review {
            color: #f87171;
        }

        .btn-delete-test {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.5;
            transition: 0.3s;
        }

        .btn-delete-test:hover {
            opacity: 1;
        }

        .btn-delete-subject {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.3;
            transition: 0.3s;
        }

        .btn-delete-subject:hover {
            opacity: 1;
        }

        .btn-add-subject {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            color: #8892b0;
            padding: 16px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .btn-add-subject:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #7eb8ff;
            color: #f0f4ff;
        }

        .btn-add-test {
            background: rgba(126, 184, 255, 0.08);
            border: 1px solid rgba(126, 184, 255, 0.15);
            color: #7eb8ff;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .btn-add-test:hover {
            background: rgba(126, 184, 255, 0.15);
            transform: scale(1.02);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(126, 184, 255, 0.2);
            transform: translateY(-4px);
        }

        .stat-card .icon {
            font-size: 28px;
            display: block;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 900;
            display: block;
            color: #7eb8ff;
            margin: 6px 0;
        }

        .stat-card .lbl {
            font-size: 12px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 28, 50, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 32px;
            border-radius: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            left: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #8892b0;
            transition: 0.3s;
        }

        .modal-close:hover {
            color: #f0f4ff;
            transform: rotate(90deg);
        }

<body>

    <!-- Stars -->
    <div class="stars" id="starsContainer"></div>

    <!-- =================== LOGIN OVERLAY =================== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <span class="icon">🚀</span>
            <h1><span class="highlight">Kimi</span> Notes</h1>
            <p class="subtitle">🔐 Sign in to access your space tracker</p>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" autofocus />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" />
            </div>

            <button class="btn-login" onclick="loginUser()">🚀 Sign In</button>
            <div class="error-msg" id="loginError">❌ Invalid username or password</div>

            <div class="footer">
                🔒 Protected · <span id="domainDisplay">loading...</span>
            </div>
        </div>
    </div>

    <!-- =================== MAIN APP =================== -->
    <div id="appContainer">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <span class="logo-text">
                    <span class="highlight">Kimi</span> Notes
                    <small>✦ Space Tracker</small>
                </span>
            </div>
            <div class="header-stats">
                <div class="user-badge">
                    <span>👤</span>
                    <span id="userDisplay">User</span>
                    <span class="role" id="userRole">User</span>
                </div>
                <button class="btn-logout" onclick="logoutUser()">🚪 Logout</button>
            </div>
        </header>

        <!-- =================== ADMIN PANEL (Only for admin) =================== -->
        <div class="admin-panel-container" id="adminPanelContainer">
            <div class="admin-panel-box">
                <div class="panel-header">
                    <h3>
                        ⚙️ Admin Panel
                        <span class="badge" id="userCountBadge">0</span>
                    </h3>
                    <span style="color:#f87171;font-size:13px;">🔒 Admin Only</span>
                </div>

                <div class="admin-grid">
                    <div>
                        <div class="form-group">
                            <label>👤 Add User (username:password)</label>
                            <input type="text" id="adminUser" placeholder="username:password" />
                        </div>
                        <button class="btn-admin btn-admin-success" onclick="addUserFromAdmin()">➕ Add User</button>
                        <button class="btn-admin btn-admin-danger" onclick="clearAllUsers()" style="margin-top:8px;">🗑️ Clear All</button>
                    </div>

                    <div>
                        <div class="user-list" id="userList">
                            <div class="empty-msg">No users registered</div>
                        </div>
                        <div class="stats" id="userStats">0 users</div>
                    </div>

            </div>

        <!-- =================== SUBJECTS =================== -->
        <section>
            <h2 class="section-title">📚 <span>Subjects</span></h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
            <button class="btn-add-subject" onclick="addSubject()">+ Add New Subject</button>
        </section>

        <!-- =================== STATS =================== -->
        <section>
            <div class="stats-cards">
                <div class="stat-card">
                    <span class="icon">📝</span>
                    <span class="number" id="totalTests">0</span>
                    <span class="lbl">Total Tests</span>
                </div>
                <div class="stat-card">
                    <span class="icon">✅</span>
                    <span class="number" id="completedTests">0</span>
                    <span class="lbl">Completed</span>
                </div>
                <div class="stat-card">
                    <span class="icon">📈</span>
                    <span class="number" id="overallAverage">0%</span>
                    <span class="lbl">Overall Avg</span>
                </div>
                <div class="stat-card">
                    <span class="icon">🏆</span>
                    <span class="number" id="badgesCount">0</span>
                    <span class="lbl">Badges</span>
                </div>
            </div>

    </div>

    <!-- =================== TEST MODAL =================== -->
    <div class="modal" id="testModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('testModal')">✕</span>
            <h2>➕ New Test</h2>
            <form id="testForm" onsubmit="addTest(event)">
                <input type="hidden" id="subjectName" />
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="testSubject" readonly />
                </div>
                <div class="form-group">
                    <label>Test Title</label>
                    <input type="text" id="testTitle" required placeholder="e.g. Grammar Quiz" />
                </div>
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" id="testTopic" placeholder="e.g. Grammar" />
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="testDate" required />
                </div>
                <div class="form-group">
                    <label>Total Marks</label>
                    <input type="number" id="testTotal" required placeholder="e.g. 50" step="0.1" />
                </div>
                <div class="form-group">
                    <label>Your Score</label>
                    <input type="number" id="testScore" required placeholder="e.g. 45" step="0.1" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="testStatus">
                        <option value="Done">✅ Done</option>
                        <option value="Planned">📅 Planned</option>
                        <option value="Review">🔄 Review</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mistakes</label>
                    <input type="text" id="testMistakes" placeholder="e.g. Grammar, Spelling" />
                </div>
                <div class="form-group">
                    <label>Weak Topic</label>
                    <input type="text" id="testWeakTopic" placeholder="e.g. Grammar" />
                </div>
                <button type="submit" class="btn-submit">💾 Save Test</button>
            </form>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ======================== SCRIPT ============================= -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  🔐 USER SYSTEM WITH ADMIN
        //  ============================================================

        // 🔑 ADMIN USERNAME (Hardcoded - Only this user can access admin panel)
        const ADMIN_USERNAME = 'admin';

        // 📝 DEFAULT USERS
        const DEFAULT_USERS = {
            'admin': { password: 'admin123', displayName: 'Admin', role: 'admin' },
            'kimi': { password: 'kimi2024', displayName: 'Kimi User', role: 'user' },
            'demo': { password: 'demo123', displayName: 'Demo User', role: 'user' },
        };

        // ============================================================
        //  USER STORAGE
        //  ============================================================

        function getUsers() {
            try {
                const raw = localStorage.getItem('kimiUsers');
                if (raw) {
                    const users = JSON.parse(raw);
                    const merged = { ...DEFAULT_USERS, ...users };
                    return merged;
                }
            } catch (e) { /* ignore */ }
            return DEFAULT_USERS;
        }

        function saveUsers(users) {
            const toSave = {};
            for (const [key, value] of Object.entries(users)) {
                if (!DEFAULT_USERS[key]) {
                    toSave[key] = value;
                }
            }
            localStorage.setItem('kimiUsers', JSON.stringify(toSave));
        }

        function addUser(username, password, displayName, role = 'user') {
            const users = getUsers();
            if (users[username]) return false;
            users[username] = { password, displayName: displayName || username, role };
            saveUsers(users);
            return true;
        }

        function removeUser(username) {
            if (DEFAULT_USERS[username]) {
                alert(`⚠️ "${username}" is a default user and cannot be removed.`);
                return false;
            }
            const users = getUsers();
            delete users[username];
            saveUsers(users);
            return true;
        }

        function validateUser(username, password) {
            const users = getUsers();
            if (!users[username]) return false;
            return users[username].password === password;
        }

        function getUserData(username) {
            const users = getUsers();
            return users[username] || null;
        }

        function isAdmin(username) {
            const user = getUserData(username);
            return user && user.role === 'admin';
        }

        // ============================================================
        //  USER DATA STORAGE (Subjects, Tests, etc.)
        //  ============================================================

        function getUserDataStorage(username) {
            try {
                const raw = localStorage.getItem(`kimiData_${username}`);
                if (raw) {
                    return JSON.parse(raw);
                }
            } catch (e) { /* ignore */ }
            return { subjects: {} };
        }

        function saveUserDataStorage(username, data) {
            localStorage.setItem(`kimiData_${username}`, JSON.stringify(data));
        }

        // ============================================================
        //  LOGIN / LOGOUT
        //  ============================================================

        let currentUser = null;
        let currentUserData = null;

        function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');

            if (!username || !password) {
                errorEl.textContent = '❌ Please fill all fields';
                errorEl.classList.add('show');
                return;
            }

            if (validateUser(username, password)) {
                currentUser = username;
                currentUserData = getUserDataStorage(username);

                const userData = getUserData(username);
                const displayName = userData?.displayName || username;
                const role = userData?.role || 'user';

                // Save session
                localStorage.setItem('kimiSession', JSON.stringify({
                    username: username,
                    displayName: displayName,
                    role: role,
                    timestamp: Date.now()
                }));

                // Show app
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('userDisplay').textContent = displayName;

                // Show role badge
                const roleEl = document.getElementById('userRole');
                if (role === 'admin') {
                    roleEl.textContent = '🔑 Admin';
                    roleEl.className = 'role admin';
                    document.getElementById('adminPanelContainer').classList.add('visible');
                } else {
                    roleEl.textContent = '👤 User';
                    roleEl.className = 'role';
                    document.getElementById('adminPanelContainer').classList.remove('visible');
                }

                renderAll();
                renderUserList();
                errorEl.classList.remove('show');
            } else {
                errorEl.textContent = '❌ Invalid username or password';
                errorEl.classList.add('show');
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
            }
        }

        function logoutUser() {
            if (!confirm('🚪 Are you sure you want to logout?')) return;
            localStorage.removeItem('kimiSession');
            currentUser = null;
            currentUserData = null;
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').focus();
        }

        // ============================================================
        //  AUTO-CHECK SESSION
        //  ============================================================

        function checkSession() {
            document.getElementById('domainDisplay').textContent = window.location.hostname;

            const session = localStorage.getItem('kimiSession');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.username && validateUser(data.username, getUsers()[data.username]?.password)) {
                        currentUser = data.username;
                        currentUserData = getUserDataStorage(data.username);

                        const userData = getUserData(data.username);
                        const displayName = userData?.displayName || data.username;
                        const role = userData?.role || 'user';

                        document.getElementById('loginOverlay').classList.add('hidden');
                        document.getElementById('appContainer').style.display = 'block';
                        document.getElementById('userDisplay').textContent = displayName;

                        const roleEl = document.getElementById('userRole');
                        if (role === 'admin') {
                            roleEl.textContent = '🔑 Admin';
                            roleEl.className = 'role admin';
                            document.getElementById('adminPanelContainer').classList.add('visible');
                        } else {
                            roleEl.textContent = '👤 User';
                            roleEl.className = 'role';
                            document.getElementById('adminPanelContainer').classList.remove('visible');
                        }

                        renderAll();
                        renderUserList();
                        return;
                    }
                } catch (e) { /* ignore */ }
            }

            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('loginUsername').focus();
        }

        // ============================================================
        //  ADMIN PANEL - USER MANAGEMENT
        //  ============================================================

        function addUserFromAdmin() {
            const input = document.getElementById('adminUser');
            const value = input.value.trim();

            if (!value || !value.includes(':')) {
                alert('❌ Please enter in format: username:password');
                return;
            }

            const [username, password] = value.split(':').map(s => s.trim());
            if (!username || !password || password.length < 4) {
                alert('❌ Password must be at least 4 characters');
                return;
            }

            if (addUser(username, password)) {
                input.value = '';
                renderUserList();
                alert(`✅ User "${username}" added successfully!`);
            } else {
                alert(`❌ User "${username}" already exists`);
            }
        }

        function removeUserFromAdmin(username) {
            if (!confirm(`❌ Remove user "${username}"?`)) return;
            if (removeUser(username)) {
                renderUserList();
                if (currentUser === username) {
                    localStorage.removeItem('kimiSession');
                    location.reload();
                }
                alert(`✅ User "${username}" removed`);
            }
        }

        function clearAllUsers() {
            if (!confirm('⚠️ Delete ALL users (except default ones)?')) return;
            const users = getUsers();
            const toKeep = {};
            for (const [key, value] of Object.entries(users)) {
                if (DEFAULT_USERS[key]) {
                    toKeep[key] = value;
                }
            }
            saveUsers(toKeep);
            renderUserList();
            alert('✅ All non-default users cleared!');
        }

        function renderUserList() {
            const users = getUsers();
            const list = document.getElementById('userList');
            const stats = document.getElementById('userStats');
            const badge = document.getElementById('userCountBadge');

            const entries = Object.entries(users);
            badge.textContent = entries.length;

            if (entries.length === 0) {
                list.innerHTML = `<div class="empty-msg">No users registered</div>`;
                stats.textContent = '0 users';
                return;
            }

            list.innerHTML = entries.map(([username, data]) => {
                const isDefault = !!DEFAULT_USERS[username];
                const roleLabel = data.role === 'admin' ? '🔑 Admin' : '👤 User';
                const roleClass = data.role === 'admin' ? 'admin-tag' : '';
                return `
                            <div class="item">
                                <span class="username">👤 ${username}</span>
                                <span class="role-tag ${roleClass}">${roleLabel}</span>
                                <button class="remove-btn" onclick="removeUserFromAdmin('${username}')" 
                                    ${isDefault ? 'style="opacity:0.2;cursor:not-allowed;" disabled' : ''}>
                                    ${isDefault ? '🔒' : '✕'}
                                </button>
                            </div>
                        `;
            }).join('');

            const defaultCount = Object.keys(DEFAULT_USERS).length;
            stats.textContent = `${entries.length} users (${defaultCount} default)`;
        }

        // ============================================================
        //  SUBJECTS FUNCTIONS
        //  ============================================================

        function getData() {
            if (!currentUser) return { subjects: {} };
            return getUserDataStorage(currentUser);
        }

        function saveData(data) {
            if (currentUser) {
                saveUserDataStorage(currentUser, data);
            }
        }

        function getTestsForSubject(subject) {
            const data = getData();
            return data.subjects[subject]?.tests || [];
        }

        function getSubjectAvg(subject) {
            const tests = getTestsForSubject(subject);
            let total = 0,
                count = 0;
            for (const t of tests) {
                if (t.total > 0) {
                    total += (t.score / t.total);
                    count++;
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getSubjectProgress(subject) {
            const tests = getTestsForSubject(subject);
            if (tests.length === 0) return 0;
            let done = 0;
            for (const t of tests) {
                if (t.status === 'Done') done++;
            }
            return done / tests.length;
        }

        function getTotalTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                count += dataObj.subjects[s].tests.length;
            }
            return count;
        }

        function getCompletedTests(dataObj) {
            let count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.status === 'Done') count++;
                }
            }
            return count;
        }

        function getOverallAvg(dataObj) {
            let total = 0,
                count = 0;
            for (const s in dataObj.subjects) {
                for (const t of dataObj.subjects[s].tests) {
                    if (t.total > 0) {
                        total += (t.score / t.total);
                        count++;
                    }
                }
            }
            return count > 0 ? total / count : 0;
        }

        function getRank(avg) {
            if (avg >= 0.9) return { label: '🏆 Master', cls: 'rank-master' };
            if (avg >= 0.8) return { label: '🥇 Excellent', cls: 'rank-excellent' };
            if (avg >= 0.7) return { label: '🥈 Strong', cls: 'rank-strong' };
            return { label: '🌱 Building', cls: 'rank-building' };
        }

        // ============================================================
        //  RENDER ALL
        //  ============================================================

        function renderAll() {
            renderSubjects();
            renderStats();
        }

        function renderSubjects() {
            const data = getData();
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';

            const subjectNames = Object.keys(data.subjects);
            if (subjectNames.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <span class="big-emoji">🚀</span>
                                <h3>No subjects yet!</h3>
                                <p style="color: #8892b0;">Click "Add New Subject" to start tracking your exams.</p>
                            </div>
                        `;
                return;
            }

            for (const [name, sub] of Object.entries(data.subjects)) {
                const tests = sub.tests;
                const avg = getSubjectAvg(name);
                const progress = getSubjectProgress(name);
                const rank = getRank(avg);
                const doneCount = tests.filter(t => t.status === 'Done').length;

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                            <div class="card-header">
                                <span class="name">${sub.emoji || '📚'} ${name}</span>
                                <span>
                                    <button class="btn-delete-subject" onclick="deleteSubject('${name}')" title="Delete subject">🗑️</button>
                                </span>
                            </div>
                            <div class="stats-grid">
                                <div class="s"><span class="num">${tests.length}</span><span class="lbl">Tests</span></div>
                                <div class="s"><span class="num">${doneCount}</span><span class="lbl">Done</span></div>
                                <div class="s"><span class="num">${(avg * 100).toFixed(0)}%</span><span class="lbl">Avg</span></div>
                                <div class="s"><span class="num">${(progress * 100).toFixed(0)}%</span><span class="lbl">Progress</span></div>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress * 100}%;"></div></div>
                            <span class="rank ${rank.cls}">${rank.label}</span>
                            <div class="test-list">
                                ${tests.slice().reverse().slice(0, 5).map(t => `
                                    <div class="test-item">
                                        <span>${t.title}</span>
                                        <span>
                                            <span class="status-${t.status}">${t.status}</span>
                                            <button class="btn-delete-test" onclick="deleteTest('${name}', '${t.title}')">✕</button>
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn-add-test" onclick="openModal('testModal', '${name}')">+ Add Test</button>
                        `;
                grid.appendChild(card);
            }
        }

        function renderStats() {
            const data = getData();
            const total = getTotalTests(data);
            const completed = getCompletedTests(data);
            const avg = getOverallAvg(data);
            document.getElementById('totalTests').textContent = total;
            document.getElementById('completedTests').textContent = completed;
            document.getElementById('overallAverage').textContent = (avg * 100).toFixed(0) + '%';
        }

        // ============================================================
        //  ACTIONS
        //  ============================================================

        function openModal(modalId, subject = '') {
            if (modalId === 'testModal') {
                document.getElementById('subjectName').value = subject;
                document.getElementById('testSubject').value = subject;
                document.getElementById('testTitle').value = '';
                document.getElementById('testTopic').value = '';
                document.getElementById('testDate').value = new Date().toISOString().slice(0, 10);
                document.getElementById('testTotal').value = '';
                document.getElementById('testScore').value = '';
                document.getElementById('testStatus').value = 'Done';
                document.getElementById('testMistakes').value = '';
                document.getElementById('testWeakTopic').value = '';
            }
            document.getElementById(modalId).classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function addTest(e) {
            e.preventDefault();
            const data = getData();
            const subject = document.getElementById('subjectName').value;
            const title = document.getElementById('testTitle').value.trim();
            const topic = document.getElementById('testTopic').value.trim();
            const date = document.getElementById('testDate').value;
            const total = parseFloat(document.getElementById('testTotal').value);
            const score = parseFloat(document.getElementById('testScore').value);
            const status = document.getElementById('testStatus').value;
            const mistakes = document.getElementById('testMistakes').value.trim();
            const weakTopic = document.getElementById('testWeakTopic').value.trim();

            if (!subject || !title || !date || isNaN(total) || isNaN(score)) {
                alert('❌ Please fill all required fields');
                return;
            }

            if (!data.subjects[subject]) {
                data.subjects[subject] = { emoji: '📚', tests: [] };
            }

            data.subjects[subject].tests.push({
                title,
                topic,
                date,
                total,
                score,
                status,
                mistakes,
                weakTopic
            });

            saveData(data);
            renderAll();
            closeModal('testModal');
        }

        function deleteTest(subject, title) {
            if (!confirm(`❌ Delete test "${title}"?`)) return;
            const data = getData();
            const tests = data.subjects[subject]?.tests || [];
            data.subjects[subject].tests = tests.filter(t => t.title !== title);
            saveData(data);
            renderAll();
        }

        function deleteSubject(subject) {
            if (!confirm(`❌ Delete subject "${subject}" and all its tests?`)) return;
            const data = getData();
            delete data.subjects[subject];
            saveData(data);
            renderAll();
        }

        function addSubject() {
            const name = prompt('📚 Enter subject name:');
            if (!name || name.trim() === '') return;
            const emoji = prompt('🎨 Enter an emoji for this subject (optional):') || '📚';
            const data = getData();
            if (data.subjects[name.trim()]) {
                alert('❌ Subject already exists');
                return;
            }
            data.subjects[name.trim()] = { emoji, tests: [] };
            saveData(data);
            renderAll();
        }

        // ============================================================
        //  STARS
        //  ============================================================

        function createStars() {
            const container = document.getElementById('starsContainer');
            const count = 100;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        //  ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('loginOverlay');
                if (!overlay.classList.contains('hidden')) {
                    loginUser();
                }
            }
        });

        // ============================================================
        //  CONSOLE
        //  ============================================================

        console.log('%c🚀 Kimi Notes - Admin System', 'font-size:20px; font-weight:bold; color:#7eb8ff;');
        console.log('%c👑 Admin: admin / admin123', 'font-size:14px; color:#fbbf24;');
        console.log('%c👤 Users: kimi / kimi2024, demo / demo123', 'font-size:14px; color:#8892b0;');

        // ============================================================
        //  INIT
        //  ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            checkSession();

            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('show');
                    }
                });
            });
        });
    </script>
